# The site's AI assistant: chat API, lead capture, daily digest, and the /admin page.
# Setup and deploy steps: see ../README.md → "AI assistant".
name = "kuiduanzeng-assistant"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Served at api.kuiduanzeng.com (the zone is on this Cloudflare account; wrangler creates the DNS record and cert).
workers_dev = false
routes = [{ pattern = "api.kuiduanzeng.com", custom_domain = true }]

[vars]
MODEL = "claude-haiku-5-5"
KB_URL = "https://kuiduanzeng.com/kb.json"
ALLOWED_ORIGINS = "https://kuiduanzeng.com,https://www.kuiduanzeng.com"
NOTIFY_EMAIL = "kuiduanz@gmail.com"
MAIL_FROM = "Jarvis <onboarding@resend.dev>"
DAILY_LIMIT = "2000"
# Cloudflare Access (protects /admin and /api/admin/*).
ACCESS_TEAM_DOMAIN = "lingering-mud-f00c.cloudflareaccess.com"
ACCESS_AUD = "39ec3f8705f39a09a3755571a1b4693dbf928616e2a51faef4a7b67208bc226c"   # the Access application's Audience (AUD) tag
ADMIN_URL = "https://api.kuiduanzeng.com/admin"   # linked from the daily digest
# Jarvis's voice (Azure neural TTS). A composed British male; a calm Mandarin male for Chinese answers.
VOICE_EN = "en-GB-RyanNeural"
VOICE_ZH = "zh-CN-YunzeNeural"

# Secrets (wrangler secret put …): ANTHROPIC_API_KEY, RESEND_API_KEY, TURNSTILE_SECRET, SESSION_SECRET,
# ADMIN_EMAIL (the email you log in to Access with; a secret so it stays out of this public repo),
# AZURE_SPEECH_KEY, AZURE_SPEECH_REGION (optional: without them Jarvis speaks with the browser's voice)
# Local overrides live in .dev.vars (see .dev.vars.example).

[[d1_databases]]
binding = "DB"
database_name = "assistant"
database_id = "7ccb4088-0c68-47ab-8f4f-e071566c99a8"

[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "LEAD_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 3
  period = 60

[[ratelimits]]
name = "SPEAK_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 10
  period = 60

# Daily digest of unanswered questions: 15:00 UTC = 08:00 Pacific (daylight time).
[triggers]
crons = ["0 15 * * *"]
