<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Jarvis Admin</title>
<style>
  :root {
    --bg: #fcfbf8; --bg-2: #f3f1ec; --ink: #1f1e1c; --ink-2: #45433f; --muted: #74716a; --rule: #e8e5df;
    --signal: #30c254; --warn: #c2410c; --accent: #1f1e1c;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0c0b; --bg-2: #171715; --ink: #efece6; --ink-2: #cfccc5; --muted: #9c9890; --rule: #2a2926; --signal: #34d058; --warn: #fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", sans-serif; letter-spacing: -.01em; }
  header { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--rule); }
  .wrap { width: min(100% - 32px, 920px); margin-inline: auto; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
  h1 { margin: 0; font-size: 17px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; }
  nav button { flex: none; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { border: 0; border-radius: 999px; padding: 7px 14px; min-height: 36px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 500; }
  button:hover { color: var(--ink); background: var(--bg-2); }
  nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .count { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--signal); color: #fff; font-size: 12px; text-align: center; }
  .count[hidden] { display: none; }
  nav button[aria-selected="true"] .count { background: var(--bg); color: var(--ink); }
  main { padding-block: 20px 80px; }
  .hint { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
  .card { border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; background: var(--bg); }
  .card.done { opacity: .5; }
  .q { font-weight: 600; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .tag { display: inline-block; padding: 0 8px; border-radius: 999px; background: var(--bg-2); font-size: 12px; color: var(--ink-2); }
  .tag.unknown { color: var(--warn); }
  .tag.answered { color: var(--signal); }
  textarea, input[type=text], select { width: 100%; border: 1px solid var(--rule); border-radius: 10px; padding: 9px 11px; background: var(--bg-2); }
  textarea { min-height: 76px; resize: vertical; margin-top: 10px; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--ink); outline-offset: 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .row select { width: auto; }
  .spacer { flex: 1; }
  .primary { background: var(--ink); color: var(--bg); }
  .primary:hover { background: var(--ink); color: var(--bg); opacity: .85; }
  .danger:hover { color: var(--warn); }
  .answer { color: var(--ink-2); white-space: pre-wrap; margin: 6px 0 0; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .filters { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters button[aria-pressed="true"] { background: var(--bg-2); color: var(--ink); }
  h2 { font-size: 14px; font-weight: 650; margin: 28px 0 10px; color: var(--ink-2); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  a { color: inherit; }
  .progress { height: 6px; border-radius: 3px; background: var(--bg-2); overflow: hidden; margin: 4px 0 18px; }
  .progress span { display: block; height: 100%; background: var(--signal); transition: width .3s; }
  #toast { position: fixed; left: 50%; bottom: 24px; translate: -50% 0; padding: 9px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <div><h1>Jarvis · 后台</h1><div class="sub">答案保存后立刻生效。写进来的内容，访客都可能问到，只写愿意公开的。</div></div>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="pending" aria-selected="true">待回答<span class="count" data-count="pending" hidden></span></button>
      <button role="tab" data-tab="interview" aria-selected="false">问卷<span class="count" data-count="interview" hidden></span></button>
      <button role="tab" data-tab="facts" aria-selected="false">知识库</button>
      <button role="tab" data-tab="log" aria-selected="false">记录与留资</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<div id="toast" role="status"></div>

<script>
const AUDIENCE = { recruiter: '招聘方', engineer: '工程师', friend: '朋友', general: '通用' };
const OUTCOME = { answered: '已回答', unknown: '不知道', declined: '婉拒' };
const view = document.getElementById('view');
let tab = 'pending';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (s) => s ? new Date(s.replace(' ', 'T') + 'Z').toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const audienceSelect = (value = 'general') =>
  `<select data-audience aria-label="受众">${Object.entries(AUDIENCE).map(([k, v]) => `<option value="${k}"${k === value ? ' selected' : ''}>${v}</option>`).join('')}</select>`;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { 'content-type': 'application/json', 'x-admin': '1', ...(options.headers || {}) },
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { toast(data.message || `出错了 (${res.status})`); throw new Error(data.error); }
  return data;
}

function setCount(name, n) {
  const el = document.querySelector(`[data-count="${name}"]`);
  el.hidden = !n; el.textContent = n;
}

// ---------- 待回答 ----------
async function renderPending() {
  const rows = await api('/api/admin/pending');
  setCount('pending', rows.length);
  if (!rows.length) { view.innerHTML = '<p class="empty">没有待回答的问题 🎉</p>'; return; }
  view.innerHTML = `<p class="hint">访客问过、但 AI 答不上来的问题，相同的问题已经合并。写好答案后，这个问题会直接加入知识库。</p>` +
    rows.map((r, i) => `
      <div class="card" data-i="${i}">
        <p class="q">${esc(r.question)}</p>
        <div class="meta"><span>${r.count > 1 ? `被问了 ${r.count} 次 · ` : ''}最近 ${when(r.last)}</span></div>
        <textarea placeholder="写下你愿意让 AI 说的答案…" aria-label="答案"></textarea>
        <div class="row">${audienceSelect()}<span class="spacer"></span>
          <button data-act="ignore">忽略</button><button class="primary" data-act="answer">保存并上线</button></div>
      </div>`).join('');
  view.onclick = async (e) => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const card = btn.closest('.card'); const r = rows[card.dataset.i];
    if (btn.dataset.act === 'ignore') {
      await api('/api/admin/pending/ignore', { method: 'POST', body: { ids: r.ids } });
      toast('已忽略');
    } else {
      const answer = card.querySelector('textarea').value.trim();
      if (!answer) { card.querySelector('textarea').focus(); return; }
      await api('/api/admin/pending/answer', { method: 'POST', body: { ids: r.ids, question: r.question, answer, audience: card.querySelector('[data-audience]').value } });
      toast('已上线');
    }
    card.classList.add('done'); card.querySelectorAll('button, textarea, select').forEach((el) => (el.disabled = true));
    setCount('pending', Number(document.querySelector('[data-count="pending"]').textContent) - 1);
  };
}

// ---------- 问卷 ----------
async function renderInterview() {
  const [drafts, live] = await Promise.all([api('/api/admin/facts?status=draft'), api('/api/admin/facts?status=live')]);
  setCount('interview', drafts.length);
  const total = drafts.length + live.length;
  const pct = total ? Math.round((live.length / total) * 100) : 0;
  if (!drafts.length) { view.innerHTML = '<p class="empty">问卷全部答完了。可以去「知识库」随时修改。</p>'; return; }
  view.innerHTML = `<p class="hint">这些是访客最可能问的问题。不想答的直接跳过就行，只有填了答案的才会被 AI 用到。</p>
    <div class="meta"><span>已上线 ${live.length} / ${total}</span></div><div class="progress"><span style="width:${pct}%"></span></div>` +
    drafts.map((f) => `
      <div class="card" data-id="${f.id}">
        <p class="q">${esc(f.question)}</p>
        <div class="meta"><span class="tag">${AUDIENCE[f.audience] || f.audience}</span></div>
        <textarea placeholder="你的答案（中文、英文都可以）" aria-label="答案"></textarea>
        <div class="row"><button class="danger" data-act="delete">删除这题</button><span class="spacer"></span><button class="primary" data-act="save">保存并上线</button></div>
      </div>`).join('');
  view.onclick = async (e) => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const card = btn.closest('.card'); const id = card.dataset.id;
    if (btn.dataset.act === 'delete') {
      if (!confirm('删除这道题？')) return;
      await api(`/api/admin/facts/${id}`, { method: 'DELETE' }); card.remove(); toast('已删除');
    } else {
      const answer = card.querySelector('textarea').value.trim();
      if (!answer) { card.querySelector('textarea').focus(); return; }
      await api(`/api/admin/facts/${id}`, { method: 'PUT', body: { answer } });
      card.classList.add('done'); card.querySelectorAll('button, textarea').forEach((el) => (el.disabled = true)); toast('已上线');
    }
  };
}

// ---------- 知识库 ----------
async function renderFacts() {
  const facts = await api('/api/admin/facts?status=live');
  view.innerHTML = `<p class="hint">AI 现在知道的私密问答（网站上公开的资料会自动包含，不用写在这里）。清空答案会把这一条退回问卷。</p>
    <div class="card" data-new>
      <input type="text" placeholder="新问题，例如：他平时用什么键盘？" aria-label="新问题" data-q />
      <textarea placeholder="答案" aria-label="答案"></textarea>
      <div class="row">${audienceSelect()}<span class="spacer"></span><button class="primary" data-act="create">添加</button></div>
    </div>` +
    (facts.length ? facts.map((f) => `
      <div class="card" data-id="${f.id}">
        <input type="text" value="${esc(f.question)}" aria-label="问题" data-q />
        <textarea aria-label="答案">${esc(f.answer)}</textarea>
        <div class="row">${audienceSelect(f.audience)}<span class="meta">更新于 ${when(f.updated_at)}</span><span class="spacer"></span>
          <button class="danger" data-act="delete">删除</button><button class="primary" data-act="save">保存</button></div>
      </div>`).join('') : '<p class="empty">还没有私密问答。先去「问卷」答几题吧。</p>');
  view.onclick = async (e) => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const card = btn.closest('.card');
    const body = { question: card.querySelector('[data-q]').value, answer: card.querySelector('textarea').value, audience: card.querySelector('[data-audience]').value };
    if (btn.dataset.act === 'create') {
      if (!body.question.trim() || !body.answer.trim()) return toast('问题和答案都要填');
      await api('/api/admin/facts', { method: 'POST', body }); toast('已添加'); renderFacts();
    } else if (btn.dataset.act === 'save') {
      await api(`/api/admin/facts/${card.dataset.id}`, { method: 'PUT', body }); toast(body.answer.trim() ? '已保存' : '已退回问卷');
      if (!body.answer.trim()) card.remove();
    } else if (confirm('删除这条问答？')) {
      await api(`/api/admin/facts/${card.dataset.id}`, { method: 'DELETE' }); card.remove(); toast('已删除');
    }
  };
}

// ---------- 记录与留资 ----------
async function renderLog(outcome = '') {
  const [log, top, leads] = await Promise.all([
    api(`/api/admin/log${outcome ? `?outcome=${outcome}` : ''}`), api('/api/admin/top'), api('/api/admin/leads'),
  ]);
  const filter = (v, label) => `<button data-outcome="${v}" aria-pressed="${outcome === v}">${label}</button>`;
  view.innerHTML = `
    <h2>留资（${leads.length}）</h2>
    ${leads.length ? `<table><thead><tr><th>时间</th><th>邮箱</th><th>姓名 / 公司</th><th>问题</th></tr></thead><tbody>${leads.map((l) => `
      <tr><td>${when(l.created_at)}</td><td><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></td><td>${esc([l.name, l.company].filter(Boolean).join(' · ') || '—')}</td><td>${esc(l.question || '—')}</td></tr>`).join('')}</tbody></table>` : '<p class="hint">还没有人留邮箱。</p>'}
    <h2>近 30 天热门问题</h2>
    ${top.length ? `<table><tbody>${top.map((t) => `<tr><td>${esc(t.question)}</td><td style="width:60px;text-align:right">${t.count}×</td></tr>`).join('')}</tbody></table>` : '<p class="hint">暂无。</p>'}
    <h2>全部问题</h2>
    <div class="filters">${filter('', '全部')}${filter('answered', '已回答')}${filter('unknown', '不知道')}${filter('declined', '婉拒')}</div>
    ${log.length ? log.map((r) => `
      <div class="card">
        <p class="q">${esc(r.question)}</p>
        <p class="answer">${esc(r.answer)}</p>
        <div class="meta"><span class="tag ${r.outcome}">${OUTCOME[r.outcome]}</span>${r.section && r.section !== 'none' ? `<span>→ #${esc(r.section)}</span>` : ''}<span>${when(r.created_at)}</span><span>会话 ${esc(r.session_id.slice(0, 6))}</span></div>
      </div>`).join('') : '<p class="empty">还没有记录。</p>'}`;
  view.onclick = (e) => { const b = e.target.closest('[data-outcome]'); if (b) renderLog(b.dataset.outcome); };
}

const renderers = { pending: renderPending, interview: renderInterview, facts: renderFacts, log: () => renderLog() };
document.querySelector('nav').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  view.innerHTML = ''; renderers[tab]();
});
renderPending();
api('/api/admin/facts?status=draft').then((d) => setCount('interview', d.length));
</script>
</body>
</html>
